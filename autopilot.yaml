# Configuration read by the autopilot: from this file by the CLI, and from
# main on GitHub by the rollout Lambda (Day 5).

# Repository holding this file and the policy files that PRs edit.
github:
  owner: singha105
  repo: iam-autopilot
  branch: main

# Roles the autopilot may tighten. Each must be tagged autopilot:managed=true and
# carry exactly one customer-managed policy under /iamap/managed/. policyFile is
# the JSON file Terraform deploys that policy from, and that a proposal PR edits.
roles:
  - name: iamap-demo-inventory-role
    policyFile: policies/demo/inventory.json
    observationDays: 1 # short for the demo; 90 in real life
    keepActions: []
  - name: iamap-demo-config-reader-role
    policyFile: policies/demo/config-reader.json
    observationDays: 1
    keepActions: []
    # The owner knows the app only reads and writes one item; without this the
    # global dynamodb list below would keep all eight data-plane actions.
    dataPlaneActions:
      dynamodb: [GetItem, PutItem]
  - name: iamap-demo-quarterly-role
    policyFile: policies/demo/quarterly.json
    observationDays: 1
    keepActions: [ssm:GetParametersByPath]

# Actions never removed from any role, whatever the usage data says.
neverRemove: []

# Data-plane actions that CloudTrail event history never records. When Access
# Advisor shows the service was used and there is evidence of data access (a
# resource of the service was seen, or no management call explains the use),
# these are kept, scoped to the resources seen, and flagged in the PR (rule R4,
# ADR-003). A role can override the list per service with its own
# dataPlaneActions.
dataPlaneActions:
  dynamodb: [GetItem, PutItem, UpdateItem, DeleteItem, Query, Scan, BatchGetItem, BatchWriteItem]
  s3: [GetObject, PutObject, DeleteObject]
  sqs: [SendMessage, ReceiveMessage, DeleteMessage]
  sns: [Publish]
  lambda: [InvokeFunction]
  kms: [Decrypt, Encrypt, GenerateDataKey]

# Post-apply watch window. lagBufferMinutes covers CloudTrail event history delay.
watch:
  minutes: 30
  lagBufferMinutes: 15
  pollSeconds: 300
